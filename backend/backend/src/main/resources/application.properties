spring.application.name=backend

#Default match docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5433/DEVPILOT
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.ai.openai.model-name=gpt-4o-mini
spring.ai.embedding.model-name=text-embedding-3-small

# App settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50

#github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23livWMAgLyK2dyuOE}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:08b2111c7c0cff4bb710520a176ca1a5ac67ea89}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

#cookies
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.timeout=7d
server.servlet.session.cookie.same-site=lax 