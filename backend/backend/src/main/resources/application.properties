spring.application.name=backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Datasource configuration with Cloud / Render environment variable support
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/DEVPILOT}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# AI Chat Service (OpenRouter / Groq / OpenAI / Gemini)
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:${OPENROUTER_API_KEY:your_openrouter_api_key_here}}
spring.ai.openai.chat.options.model=${AI_MODEL:${OPENROUTER_MODEL:openrouter/free}}
spring.ai.openai.embedding.enabled=false

# Vector Embeddings (Gemini text-embedding-004)
app.gemini.api-key=${GEMINI_API_KEY:${app.gemini.api-key:your_gemini_api_key_here}}
app.embedding.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# App settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50

# Github OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your_github_client_id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your_github_client_secret}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Session & Cookies (Supports Secure/SameSite overrides for Cross-Domain production setups)
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.timeout=7d
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}