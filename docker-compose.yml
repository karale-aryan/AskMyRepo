services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: DEVPILOT-postgres
    environment:
      POSTGRES_DB: DEVPILOT
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - DEVPILOT_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extension.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DEVPILOT"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DEVPILOT-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/DEVPILOT
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - FRONTEND_URL=http://localhost:3000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - TOKEN_ENCRYPTOR_PASSWORD=${TOKEN_ENCRYPTOR_PASSWORD:-devpilot-local-encrypt-key-change-me}
      - TOKEN_ENCRYPTOR_SALT=${TOKEN_ENCRYPTOR_SALT:-deadbeefcafebabe}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  DEVPILOT_pg_data: